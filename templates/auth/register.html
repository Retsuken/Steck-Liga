{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:0 auto">
  <h1>Регистрация по email</h1>
  <p class="muted">Адрес нужно подтвердить. Пароль хранится только в виде хеша Django PBKDF2.</p>
  <form method="post" class="stack">
    {% csrf_token %}
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Пароль</label>
    <input type="password" name="password" minlength="8" required>
    <label>Повтор пароля</label>
    <input type="password" name="password2" minlength="8" required>
    <label>Роль</label>
    <select name="role" required>
      <option value="candidate">Кандидат</option>
      <option value="employer">Работодатель</option>
    </select>
    <label class="option"><input type="checkbox" name="consent_pd"> Согласен(на) на обработку персональных данных в соответствии с 152-ФЗ</label>
    <button class="btn dark" type="submit">Создать аккаунт</button>
  </form>
</div>
{% endblock %}
